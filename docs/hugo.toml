baseURL = 'https://bsreeram08.github.io/gurl/'
locale = 'en-us'
title = 'gurl'
theme = 'hextra'
enableRobotsTXT = true

# Fail the build on a broken {{< ref >}} / {{< relref >}}.
refLinksErrorLevel = "ERROR"

[outputs]
home = ["HTML", "llms"]
page = ["HTML"]
section = ["HTML"]

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true
# Keep "--flag" literal in prose and headings (no en/em-dash substitution).
[markup.goldmark.extensions.typographer]
enDash = "--"
emDash = "---"

[params]
gurl_version = "dev"
description = "CLI API workbench — save, run, and manage HTTP requests from the terminal"
externalLinkDecoration = true
displayUpdatedDate = false

[params.navbar]
displayTitle = true
displayLogo = false
width = "wide"

[params.page]
width = "normal"

[params.theme]
default = "system"
displayToggle = true

[params.footer]
enable = true
displayCopyright = false
displayPoweredBy = true

[params.search]
enable = true
type = "flexsearch"
[params.search.flexsearch]
index = "content"
tokenize = "forward"

[params.highlight.copy]
enable = true
display = "hover"

[params.editURL]
enable = true
base = "https://github.com/bsreeram08/gurl/edit/master/docs/content"

# Navbar. The sidebar is built from the content tree (sections ordered by
# `weight` in each _index.md), because the home page has `type: docs`.
[menus]
[[menus.main]]
identifier = "docs"
name = "Docs"
pageRef = "/docs"
weight = 1

[[menus.main]]
identifier = "cli"
name = "CLI reference"
pageRef = "/cli"
weight = 2

[[menus.main]]
name = "Search"
weight = 3
[menus.main.params]
type = "search"

[[menus.main]]
name = "GitHub"
weight = 4
url = "https://github.com/bsreeram08/gurl"
[menus.main.params]
icon = "github"

[[menus.main]]
name = "Theme"
weight = 5
[menus.main.params]
type = "theme-toggle"
