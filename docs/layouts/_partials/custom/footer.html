{{- /* Versioned-docs selector. The docs workflow publishes each release under
       /gurl/<version>/ plus /gurl/latest/, and lists versions in /gurl/versions.json. */ -}}
{{ with site.Params.gurl_version }}
<div class="gurl-version-selector" id="gurlVersionSelector" hidden>
  <label for="gurlVersionSelect">Version</label>
  <select id="gurlVersionSelect" aria-label="Select documentation version"></select>
</div>

<script>
(function () {
  var current = {{ . | jsonify }};
  var base = "https://bsreeram08.github.io/gurl/";

  // Path after the version prefix, so switching keeps the current page.
  // e.g. /gurl/v0.7.0/cli/run/ -> cli/run/
  function currentRelPath() {
    var m = window.location.pathname.match(/^\/gurl\/[^/]+\/(.*)/);
    return m ? m[1] : "";
  }

  fetch(base + "versions.json")
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (versions) {
      if (!versions || versions.length === 0) return;
      var selector = document.getElementById("gurlVersionSelector");
      var select = document.getElementById("gurlVersionSelect");
      var relPath = currentRelPath();

      ["latest"].concat(versions).forEach(function (v) {
        var opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        if (v === current) opt.selected = true;
        select.appendChild(opt);
      });

      select.addEventListener("change", function () {
        window.location.href = base + select.value + "/" + relPath;
      });

      selector.hidden = false;
    })
    .catch(function () { /* versions.json not published yet */ });
}());
</script>
{{ end }}
