name: Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update Homebrew formula for (e.g. v0.1.16)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: amd64
          - os: macos-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Download modules
        run: go mod download

      - name: Test
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'amd64'
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          case "${{ matrix.os }}" in
            macos-latest) os_name="darwin" ;;
            ubuntu-latest) os_name="linux" ;;
            windows-latest) os_name="windows" ;;
            *) os_name="${{ matrix.os }}" ;;
          esac
          name="valetkey-${os_name}-${{ matrix.arch }}${ext}"
          CGO_ENABLED=0 GOOS="$os_name" GOARCH="${{ matrix.arch }}" go build -ldflags="-s -w -X main.version=${VERSION} -X github.com/bsreeram08/valetkey/internal/cli/commands.CurrentVersion=${VERSION}" -o "$name" ./cmd/valetkey
          # Same bytes under the pre-rename asset name, so `gurl update` in
          # releases before the rename can still find and verify it.
          cp "$name" "gurl-${os_name}-${{ matrix.arch }}${ext}"

      - name: Checksum
        run: |
          case "${{ matrix.os }}" in
            macos-latest) os_name="darwin" ;;
            ubuntu-latest) os_name="linux" ;;
            windows-latest) os_name="windows" ;;
            *) os_name="${{ matrix.os }}" ;;
          esac
          checksum_file="checksums-${os_name}-${{ matrix.arch }}.txt"
          mkdir -p checksums
          : > "checksums/$checksum_file"
          for name in "valetkey-${os_name}-${{ matrix.arch }}" "gurl-${os_name}-${{ matrix.arch }}"; do
            # Use macOS-compatible sha256 command
            if command -v shasum &>/dev/null; then
              shasum -a 256 "$name" >> "checksums/$checksum_file"
            else
              sha256sum "$name" >> "checksums/$checksum_file"
            fi
            tar -czf "${name}.tar.gz" "$name"
          done
          echo "Created checksums/$checksum_file:"
          cat "checksums/$checksum_file"

      - name: Upload Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: valetkey-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            valetkey-linux-${{ matrix.arch }}
            valetkey-linux-${{ matrix.arch }}.tar.gz
            gurl-linux-${{ matrix.arch }}
            gurl-linux-${{ matrix.arch }}.tar.gz
            checksums/
          if-no-files-found: error

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: valetkey-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            valetkey-darwin-${{ matrix.arch }}
            valetkey-darwin-${{ matrix.arch }}.tar.gz
            gurl-darwin-${{ matrix.arch }}
            gurl-darwin-${{ matrix.arch }}.tar.gz
            checksums/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: valetkey-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          echo "=== Checking checksums directory ==="
          ls -la checksums/ 2>/dev/null || echo "checksums/ not found"
          echo ""
          echo "=== Concatenating all checksum files ==="
          cat checksums/checksums-*.txt > SHA256SUMS 2>/dev/null || { echo "No checksums/checksums-*.txt found!"; ls -la checksums/ 2>/dev/null; exit 1; }
          echo "Merged SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            valetkey-*
            gurl-*
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}"
          # Also publish under the pre-rename image name while users move over.
          legacy="ghcr.io/bsreeram08/gurl"
          tags="${image}:${VERSION},${legacy}:${VERSION}"
          # Pre-release tags (e.g. v1.0.0-rc.1) do not move :latest.
          if [[ "$VERSION" != *-* ]]; then
            tags+=",${image}:latest,${legacy}:latest"
          fi
          {
            echo "version=${VERSION}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Saved API requests your AI agents can run without ever seeing the keys
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "VERSION=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            echo "VERSION=$REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Download release tarballs
        run: |
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/valetkey-${target}.tar.gz"
          done

      - name: Compute checksums
        run: |
          {
            echo "SHA_DARWIN_ARM64=$(sha256sum valetkey-darwin-arm64.tar.gz | cut -d' ' -f1)"
            echo "SHA_LINUX_AMD64=$(sha256sum valetkey-linux-amd64.tar.gz | cut -d' ' -f1)"
            echo "SHA_LINUX_ARM64=$(sha256sum valetkey-linux-arm64.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Update formula
        run: |
          VERSION_NUM="${VERSION#v}"
          mkdir -p Formula
          cat > Formula/valetkey.rb << EOF
          class Valetkey < Formula
            desc "Saved API requests your AI agents can run without ever seeing the keys"
            homepage "https://github.com/bsreeram08/valetkey"
            version "${VERSION_NUM}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/bsreeram08/valetkey/releases/download/${VERSION}/valetkey-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/bsreeram08/valetkey/releases/download/${VERSION}/valetkey-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              elsif Hardware::CPU.intel?
                url "https://github.com/bsreeram08/valetkey/releases/download/${VERSION}/valetkey-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install Dir["valetkey-*"].first => "valetkey"
              # The pre-rename command name keeps working.
              bin.install_symlink "valetkey" => "gurl"
            end

            test do
              system "#{bin}/valetkey", "--version"
            end
          end
          EOF
          # brew upgrade moves existing "brew install gurl" users to valetkey.
          printf '{\n  "gurl": "valetkey"\n}\n' > formula_renames.json
          git rm -q --ignore-unmatch Formula/gurl.rb

      - name: Commit and push formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula formula_renames.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update formula to ${VERSION}"
          git push
